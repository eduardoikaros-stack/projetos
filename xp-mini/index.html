<script>
'use strict';
const $=s=>document.querySelector(s), desktop=$('#desktop'), menu=$('#startmenu'), context=$('#context'), icons=$('#icons');
const apps=[['computer','🖥️','Meu computador'],['files','📁','Meus documentos'],['notes','📝','Bloco de notas'],['zip','🗜️','Leitor ZIP'],['media','🎬','Windows Media Player'],['browser','🌐','Internet']];
let db, topZ=10, serial=0, positions={}, selectedIcon=null, suppressClick=false, menuAction=null;
try{positions=JSON.parse(localStorage.getItem('minixp-icon-positions')||'{}')}catch{}
const dbReady=new Promise((resolve,reject)=>{let r=indexedDB.open('minixp-files-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'name'});r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>reject(r.error)});
async function all(){await dbReady;return new Promise((yes,no)=>{let r=db.transaction('files').objectStore('files').getAll();r.onsuccess=()=>yes(r.result);r.onerror=()=>no(r.error)})}
async function put(obj){await dbReady;return new Promise((yes,no)=>{let t=db.transaction('files','readwrite');t.objectStore('files').put(obj);t.oncomplete=yes;t.onerror=()=>no(t.error)})}
async function del(name){await dbReady;return new Promise((yes,no)=>{let t=db.transaction('files','readwrite');t.objectStore('files').delete(name);t.oncomplete=yes;t.onerror=()=>no(t.error)})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=$('#toast');t.textContent=s;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
function savePos(){try{localStorage.setItem('minixp-icon-positions',JSON.stringify(positions))}catch{toast('Não foi possível salvar a posição dos ícones.')}}
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function clock(){$('#clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,30000);
const safe=fn=>Promise.resolve().then(fn).catch(e=>{console.error(e);toast('Não foi possível concluir. Verifique o armazenamento do navegador.')});
function renderIcons(){let basics=apps.filter(x=>x[0]!=='zip');let html=basics.map((x,i)=>iconMarkup(x[0],x[1],x[2],i)).join('');all().then(items=>{let folders=items.filter(x=>x.kind==='folder' && x.name.startsWith('Área de trabalho/') && !x.name.slice('Área de trabalho/'.length).includes('/'));icons.innerHTML=html+folders.map((x,i)=>iconMarkup('folder:'+x.name,'📁',x.name.split('/').pop(),basics.length+i)).join('');bindIcons()}).catch(()=>{icons.innerHTML=html;bindIcons();toast('Armazenamento indisponível neste navegador.')})}
function iconMarkup(id,emoji,label,i){let p=positions[id]||{x:8,y:10+i*76};return `<button class="desk-icon" data-icon="${esc(id)}" style="left:${Math.max(0,Math.min(innerWidth-65,p.x))}px;top:${Math.max(0,Math.min(innerHeight-100,p.y))}px" title="${esc(label)}"><span class="icon">${emoji}</span>${esc(label)}</button>`}
function bindIcons(){icons.querySelectorAll('.desk-icon').forEach(el=>{let start=null,press=null,moved=false,held=false;el.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.stopPropagation();selectIcon(el);start={x:e.clientX,y:e.clientY,l:el.offsetLeft,t:el.offsetTop,type:e.pointerType};moved=false;held=false;el.setPointerCapture(e.pointerId);if(e.pointerType==='touch')press=setTimeout(()=>{if(start&&!moved){held=true;showIconMenu(el,e.clientX,e.clientY)}},2000)});el.addEventListener('pointermove',e=>{if(!start)return;let dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>8){moved=true;clearTimeout(press)}if(moved){el.style.left=Math.max(0,Math.min(innerWidth-el.offsetWidth,start.l+dx))+'px';el.style.top=Math.max(0,Math.min(innerHeight-38-el.offsetHeight,start.t+dy))+'px'}});el.addEventListener('pointerup',e=>{if(!start)return;clearTimeout(press);if(moved){positions[el.dataset.icon]={x:el.offsetLeft,y:el.offsetTop};savePos();suppressClick=true;setTimeout(()=>suppressClick=false,400)}else if(held){suppressClick=true;setTimeout(()=>suppressClick=false,400)}else if(start.type==='touch'){openIcon(el.dataset.icon);suppressClick=true;setTimeout(()=>suppressClick=false,400)}start=null});el.addEventListener('pointercancel',()=>{clearTimeout(press);start=null});el.addEventListener('dblclick',()=>{if(!suppressClick)openIcon(el.dataset.icon)});el.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();selectIcon(el);showIconMenu(el,e.clientX,e.clientY)});el.addEventListener('keydown',e=>{if(e.key==='Enter')openIcon(el.dataset.icon)});el.addEventListener('click',e=>e.stopPropagation())})}
function selectIcon(el){icons.querySelectorAll('.desk-icon').forEach(x=>x.classList.toggle('selected',x===el));selectedIcon=el.dataset.icon}
function openIcon(id){if(id.startsWith('folder:'))open('files',{path:id.slice(7)});else open(id)}
function setContext(x,y,rows){context.innerHTML=rows.map((r,i)=>`<button data-context="${i}" ${r.disabled?'disabled':''}>${esc(r.label)}</button>`).join('');menuAction=rows;context.style.display='block';context.style.left=Math.max(0,Math.min(x,innerWidth-context.offsetWidth-5))+'px';context.style.top=Math.max(0,Math.min(y,innerHeight-context.offsetHeight-42))+'px'}
function showIconMenu(el,x,y){let id=el.dataset.icon;let rows=[{label:'Abrir',run:()=>openIcon(id)}];if(id.startsWith('folder:')){rows.push({label:'Renomear',run:()=>safe(()=>renameFolder(id.slice(7)))},{label:'Excluir',run:()=>safe(()=>removeFolder(id.slice(7)))})}else rows.push({label:'Propriedades',run:()=>toast('Atalho para o aplicativo.')});setContext(x,y,rows)}
function showDesktopMenu(x,y){setContext(x,y,[{label:'Organizar ícones',run:()=>{positions={};savePos();renderIcons()}},{label:'Atualizar',run:()=>renderIcons()},{label:'Nova pasta',run:()=>safe(createFolder)},{label:'Propriedades',run:()=>open('computer') }])}
async function createFolder(){let n=prompt('Nome da nova pasta:','Nova pasta');if(!n)return;n=n.trim();if(!n||/[\\/]/.test(n))return toast('Use um nome sem barras.');let name='Área de trabalho/'+n;if((await all()).some(x=>x.name===name))return toast('Essa pasta já existe.');await put({name,kind:'folder',updated:Date.now()});renderIcons()}
async function renameFolder(name){let old=name.split('/').pop(),n=prompt('Novo nome da pasta:',old);if(!n||n===old)return;if(/[\\/]/.test(n))return toast('Use um nome sem barras.');let items=await all(),newName=name.slice(0,name.lastIndexOf('/')+1)+n;if(items.some(x=>x.name===newName))return toast('Já existe uma pasta com esse nome.');for(let item of items.filter(x=>x.name===name||x.name.startsWith(name+'/'))){await put({...item,name:newName+item.name.slice(name.length)});await del(item.name)}if(positions['folder:'+name]){positions['folder:'+newName]=positions['folder:'+name];delete positions['folder:'+name];savePos()}renderIcons()}
async function removeFolder(name){let items=await all();if(!confirm('Excluir esta pasta e tudo que há nela?'))return;for(let x of items.filter(x=>x.name===name||x.name.startsWith(name+'/')))await del(x.name);renderIcons()}
context.onclick=e=>{let b=e.target.closest('[data-context]');if(!b)return;let action=menuAction[Number(b.dataset.context)];context.style.display='none';action?.run?.()};
let hold,down;desktop.addEventListener('pointerdown',e=>{if(e.target!==desktop&&e.target!==icons)return;if(e.pointerType==='touch'){down={x:e.clientX,y:e.clientY};hold=setTimeout(()=>{showDesktopMenu(down.x,down.y);down=null},2000)}});desktop.addEventListener('pointermove',e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>10){clearTimeout(hold);down=null}});desktop.addEventListener('pointerup',()=>{clearTimeout(hold);down=null});desktop.addEventListener('pointercancel',()=>{clearTimeout(hold);down=null});desktop.addEventListener('contextmenu',e=>{if(e.target!==desktop&&e.target!==icons)return;e.preventDefault();showDesktopMenu(e.clientX,e.clientY)});
$('#startlist').innerHTML=apps.map(a=>`<button data-launch="${a[0]}"><span>${a[1]}</span>${a[2]}</button>`).join('');$('#start').onclick=()=>menu.classList.toggle('open');document.addEventListener('click',e=>{let l=e.target.closest('[data-launch]');if(l){open(l.dataset.launch);menu.classList.remove('open')}else if(!e.target.closest('#startmenu,#start'))menu.classList.remove('open');if(!e.target.closest('#context'))context.style.display='none'});
function open(app,options={}){let info=apps.find(a=>a[0]===app)||['home','🏠','Bem-vindo'];let id='w'+(++serial),w=document.createElement('section');w.className='window';w.dataset.window=id;w.innerHTML=`<div class="titlebar"><span>${info[1]}</span><span class="title">${esc(info[2])}</span><button class="win-btn min" title="Minimizar">−</button><button class="win-btn max" title="Maximizar">□</button><button class="win-btn close" title="Fechar">×</button></div><div class="menu-bar"><span>Arquivo</span><span>Editar</span><span>Exibir</span><span>Favoritos</span><span>Ferramentas</span><span>Ajuda</span></div><div class="window-body"></div><div class="statusbar"><span class="state">Pronto</span><span></span></div>`;desktop.insertBefore(w,$('#context'));let task=document.createElement('button');task.className='taskitem';task.textContent=info[1]+'  '+info[2];task.title=info[2];$('#tasks').append(task);w._task=task;focus(w);let offset=(serial-1)%5*22;if(innerWidth>650){w.style.left=`calc(50% + ${offset}px)`;w.style.top=`calc(48% + ${offset}px)`}task.onclick=()=>{if(w.classList.contains('hidden')){w.classList.remove('hidden');focus(w)}else if(w.classList.contains('active')){w.classList.add('hidden');task.classList.remove('active')}else focus(w)};w.addEventListener('pointerdown',()=>focus(w));w.querySelector('.close').onclick=()=>{w.querySelectorAll('video,audio').forEach(v=>{v.pause();if(v.src.startsWith('blob:'))URL.revokeObjectURL(v.src)});w.remove();task.remove()};w.querySelector('.min').onclick=()=>{w.classList.add('hidden');task.classList.remove('active')};w.querySelector('.max').onclick=()=>maximize(w);bindWindowDrag(w);renderApp(w,app,options);return w}
function focus(w){document.querySelectorAll('.window').forEach(x=>{x.classList.remove('active');x._task?.classList.remove('active')});w.classList.add('active');w._task?.classList.add('active');w.style.zIndex=++topZ}
function maximize(w){if(!w._max){w._restore={left:w.style.left,top:w.style.top,width:w.style.width,height:w.style.height,transform:w.style.transform};Object.assign(w.style,{left:'0px',top:'0px',width:'100%',height:'calc(100dvh - 38px)',transform:'none'});w._max=true;w.querySelector('.max').textContent='❐'}else{Object.assign(w.style,w._restore);w._max=false;w.querySelector('.max').textContent='□'}}
function bindWindowDrag(w){let bar=w.querySelector('.titlebar'),drag;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||w._max||e.button!==0)return;let r=w.getBoundingClientRect();drag={x:e.clientX,y:e.clientY,l:r.left,t:r.top};w.style.transform='none';w.style.left=r.left+'px';w.style.top=r.top+'px';bar.setPointerCapture(e.pointerId);e.preventDefault()});bar.addEventListener('pointermove',e=>{if(!drag)return;w.style.left=Math.max(-w.offsetWidth+70,Math.min(innerWidth-70,drag.l+e.clientX-drag.x))+'px';w.style.top=Math.max(0,Math.min(innerHeight-75,drag.t+e.clientY-drag.y))+'px'});bar.addEventListener('pointerup',()=>drag=null);bar.addEventListener('pointercancel',()=>drag=null);bar.addEventListener('dblclick',e=>{if(!e.target.closest('button'))maximize(w)})}
function renderApp(w,app,opt){let b=w.querySelector('.window-body');if(app==='home'){b.classList.add('welcome');b.innerHTML=`<div class="hero"><div class="eyebrow">SEU PEQUENO ESPAÇO DIGITAL</div><h1>Bem-vindo ao miniXP<span style="color:#2873d9">.</span></h1><p>Uma área de trabalho web para criar e experimentar, direto no navegador.</p></div><div class="home-content"><div class="section-title">COMECE POR AQUI</div><div class="cards">${[['files','📁','Meus documentos','Abra seus arquivos'],['notes','📝','Bloco de notas','Escreva e salve textos'],['media','🎬','Reprodutor de mídia','Vídeo com som de exemplo'],['browser','🌐','Internet','Abra links no navegador']].map(x=>`<button class="card" data-launch="${x[0]}"><span class="emoji">${x[1]}</span><span><b>${x[2]}</b><small>${x[3]}</small></span></button>`).join('')}</div><div class="hint">✦ Toque para abrir um ícone. Arraste para mover. Segure por 2 segundos para opções.</div></div>`}if(app==='computer')computer(w);if(app==='files')files(w,opt.path||'');if(app==='notes')notes(w,opt.name||'',opt.text||'',opt);if(app==='zip')zip(w,opt.blob);if(app==='media')media(w,opt.blob);if(app==='browser')browser(w)}
function computer(w){let b=w.querySelector('.window-body');b.innerHTML=`<div class="toolbar"><button class="btn" data-launch="files">📁 Meus documentos</button></div><div class="explorer"><aside><b>Tarefas do sistema</b><p>Ver informações do sistema<br>Adicionar ou remover programas<br>Alterar uma configuração</p><b>Outros locais</b><p>Meus documentos<br>Painel de controle</p><b>Detalhes</b><p>Meu computador</p></aside><div class="computer-main"><div class="section-title">ARQUIVOS ARMAZENADOS NESTE COMPUTADOR</div><button class="folder-tile" data-launch="files"><span>📁</span>Meus documentos</button><div class="section-title" style="margin-top:18px">UNIDADES DE DISCO RÍGIDO</div><button class="folder-tile" data-launch="files"><span>💽</span>Disco local (C:)</button><div class="section-title" style="margin-top:18px">DISPOSITIVOS COM ARMAZENAMENTO REMOVÍVEL</div><button class="folder-tile" data-launch="files"><span>💿</span>Unidade de CD (D:)</button></div></div>`}

/* Textos que moram FORA do sistema (pasta textos/ do site): editar fora e
   Atualizar no Explorador traz o texto novo para dentro. */
const notesHandles=new Map(); let cutName=null, dragName=null;
async function loadExternalNames(){try{let r=await fetch('textos/index.json',{cache:'no-store'});if(!r.ok)return[];let j=await r.json();let list=Array.isArray(j)?j:(j.arquivos||[]);return list.map(x=>typeof x==='string'?x:x.nome).filter(Boolean)}catch{return[]}}
async function uniqueTextName(prefix){let items=await all(),exists=n=>items.some(x=>x.name===n);let base=prefix+'Novo Documento de Texto.txt';if(!exists(base))return base;for(let i=2;;i++){let n=prefix+'Novo Documento de Texto ('+i+').txt';if(!exists(n))return n}}
async function moveItem(name,dest){if(!name)return false;if(name===dest||(dest&&dest.startsWith(name+'/'))){toast('Não é possível mover uma pasta para dentro dela mesma.');return false}let base=name.split('/').pop(),target=dest?dest+'/'+base:base,items=await all();if(name===target)return false;if(items.some(x=>x.name===target)){toast('Já existe um item com esse nome no destino.');return false}let moving=items.filter(x=>x.name===name||x.name.startsWith(name+'/'));if(!moving.length)return false;for(let it of moving)await put({...it,name:target+it.name.slice(name.length),updated:Date.now()});for(let it of moving)await del(it.name);return true}
async function renameItem(name){let old=name.split('/').pop(),n=prompt('Renomear para:',old);if(!n||n===old)return false;n=n.trim();if(!n||/[\\/]/.test(n)){toast('Use um nome sem barras.');return false}let items=await all(),target=name.slice(0,name.lastIndexOf('/')+1)+n;if(items.some(x=>x.name===target)){toast('Já existe um item com esse nome.');return false}let moving=items.filter(x=>x.name===name||x.name.startsWith(name+'/'));for(let it of moving)await put({...it,name:target+it.name.slice(name.length)});for(let it of moving)await del(it.name);if(positions['folder:'+name]){positions['folder:'+target]=positions['folder:'+name];delete positions['folder:'+name];savePos()}return true}
async function connectExternalFile(){if(!window.showOpenFilePicker){toast('Neste navegador não dá para conectar arquivo. Use Importar/Baixar.');return}try{let [h]=await showOpenFilePicker({types:[{description:'Texto',accept:{'text/plain':['.txt']}}]});let f=await h.getFile();notesHandles.set(f.name,h);open('notes',{name:f.name,text:await f.text(),handleKey:f.name})}catch{}}
async function files(w,path=''){let b=w.querySelector('.window-body'), prefix=path?path+'/':'';w.querySelector('.title').textContent=path?path.split('/').pop():'Meus documentos';b.innerHTML=`<div class="toolbar"><button class="btn" data-action="back">⬅ Voltar</button><button class="btn" data-action="new">📁 Nova pasta</button><button class="btn" data-action="text">📝 Novo texto</button><button class="btn" data-action="import">⬆ Importar</button><button class="btn" data-action="refresh">↻ Atualizar</button><button class="btn" data-action="connect">🔗 Conectar arquivo</button><input class="picker" type="file" multiple hidden></div><div class="address">Endereço <input value="${esc(path||'Meus documentos')}" readonly></div><div class="explorer"><aside><b>Tarefas de arquivo e pasta</b><p>Criar uma nova pasta<br>Compartilhar esta pasta</p><b>Outros locais</b><p>Área de trabalho<br>Meus documentos<br>Meu computador</p><b>Detalhes</b><p>${esc(path||'Meus documentos')}</p></aside><div class="file-grid">Carregando…</div></div>`;let act=s2=>b.querySelector(`[data-action="${s2}"]`);act('back').onclick=()=>files(w,path.includes('/')?path.slice(0,path.lastIndexOf('/')):'');act('new').onclick=()=>safe(async()=>{let n=prompt('Nome da nova pasta:','Nova pasta');if(!n)return;n=n.trim();if(!n||/[\\/]/.test(n))return toast('Use um nome sem barras.');let name=prefix+n;if((await all()).some(f=>f.name===name))return toast('Nome já existe.');await put({name,kind:'folder',updated:Date.now()});files(w,path)});act('text').onclick=()=>safe(async()=>open('notes',{name:await uniqueTextName(prefix)}));act('refresh').onclick=()=>files(w,path);act('connect').onclick=()=>connectExternalFile();act('import').onclick=()=>b.querySelector('.picker').click();b.querySelector('.picker').onchange=e=>safe(async()=>{for(let f of e.target.files)await put({name:prefix+f.name,blob:f,updated:Date.now()});files(w,path);toast('Arquivos importados neste navegador.')});function explorerMenu(x,y){let rows=[{label:'Novo texto',run:()=>safe(async()=>open('notes',{name:await uniqueTextName(prefix)}))},{label:'Nova pasta',run:()=>act('new').onclick()},{label:'Colar',disabled:!cutName,run:()=>safe(async()=>{if(await moveItem(cutName,path)){cutName=null;files(w,path);toast('Movido para cá.')}})},{label:'Atualizar',run:()=>files(w,path)}];setContext(x,y,rows)}try{let locals=(await all()).filter(f=>f.name.startsWith(prefix)&&!f.name.slice(prefix.length).includes('/'));let externals=[];if(!path){let names=await loadExternalNames();externals=names.filter(n=>!locals.some(f=>f.name===n)).map(n=>({name:n,kind:'external',url:'textos/'+n}))}let list=[...locals,...externals];if(!w.isConnected)return;let grid=b.querySelector('.file-grid');grid.innerHTML=list.length?list.map((f,i)=>`<button class="folder-tile" draggable="true" data-index="${i}"><span>${f.kind==='folder'?'📁':f.kind==='external'?'🌐':/\.zip$/i.test(f.name)?'🗜️':/\.(mp4|webm|mp3|wav|ogg)$/i.test(f.name)?'🎞️':'📄'}</span>${esc(f.name.slice(prefix.length))}</button>`).join(''):'<div class="empty">Esta pasta está vazia.</div>';let lpTimer=null,lpPos=null;grid.addEventListener('contextmenu',e=>{if(e.target.closest('[data-index]'))return;e.preventDefault();explorerMenu(e.clientX,e.clientY)});grid.addEventListener('pointerdown',e=>{if(e.target!==grid)return;lpPos={x:e.clientX,y:e.clientY};clearTimeout(lpTimer);lpTimer=setTimeout(()=>explorerMenu(lpPos.x,lpPos.y),2000)});['pointermove','pointerup','pointercancel'].forEach(ev=>grid.addEventListener(ev,()=>clearTimeout(lpTimer)));grid.addEventListener('dragover',e=>{e.preventDefault()});grid.addEventListener('drop',e=>{e.preventDefault();if(dragName&&!e.target.closest('[data-index]'))safe(async()=>{if(await moveItem(dragName,path)){cutName=null;files(w,path);toast('Movido para cá.')}})});grid.querySelectorAll('[data-index]').forEach(el=>{let f=list[Number(el.dataset.index)];let go=()=>f.kind==='folder'?files(w,f.name):f.kind==='external'?safe(async()=>{let t=await (await fetch(f.url,{cache:'no-store'})).text();open('notes',{name:f.name,text:t,externalUrl:f.url})}):safe(()=>openFile(f));el.onclick=e=>{grid.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');if(e.detail===0||matchMedia('(pointer: coarse)').matches)go()};el.ondblclick=go;el.addEventListener('dragstart',e=>{dragName=f.name;e.dataTransfer?.setData('text/plain',f.name)});el.addEventListener('dragend',()=>dragName=null);if(f.kind==='folder'){el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drop-target')});el.addEventListener('dragleave',()=>el.classList.remove('drop-target'));el.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();el.classList.remove('drop-target');let dragged=dragName||e.dataTransfer?.getData('text/plain');safe(async()=>{if(await moveItem(dragged,f.name)){cutName=null;files(w,path);toast('Movido para '+f.name.split('/').pop()+'.')}})});}el.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();let rows=f.kind==='external'?[{label:'Abrir',run:go}]:[{label:'Abrir',run:go},{label:'Recortar',run:()=>{cutName=f.name;toast('Recortado. Clique com o botão direito no destino e escolha Colar.')}},{label:'Renomear',run:()=>safe(async()=>{if(await renameItem(f.name)){if(f.kind==='folder')renderIcons();files(w,path)}})},{label:'Baixar',disabled:!f.blob,run:()=>download(f.blob,f.name.split('/').pop())},{label:'Excluir',run:()=>safe(async()=>{if(f.kind==='folder')await removeFolder(f.name);else if(confirm('Excluir arquivo?'))await del(f.name);files(w,path)})}];setContext(e.clientX,e.clientY,rows)}})}catch(e){console.error(e);b.querySelector('.file-grid').textContent='Armazenamento indisponível.'}}


async function openFile(f){if(f.kind==='folder')return open('files',{path:f.name});let name=f.name;if(/\.txt$/i.test(name)||f.blob.type.startsWith('text/'))open('notes',{name,text:await f.blob.text()});else if(/\.zip$/i.test(name))open('zip',{blob:f.blob});else if(/\.(mp4|webm|mp3|wav|ogg)$/i.test(name)||/^(audio|video)\//.test(f.blob.type))open('media',{blob:f.blob});else if(/\.exe$/i.test(name))toast('Não é possível executar .exe em um site.');else toast('Formato não suportado; baixe o arquivo para abrir no aparelho.')}
function notes(w,name,text,opt={}){let b=w.querySelector('.window-body');b.innerHTML=`<div class="toolbar"><input class="filename" placeholder="Nome do arquivo" value="${esc(name||'meu-texto.txt')}"><button class="btn primary" data-save>💾 Salvar</button><button class="btn" data-download>⬇ Baixar</button><span class="save-state" style="font-size:10px;color:#637080"></span></div><textarea class="editor" placeholder="Comece a escrever aqui..." spellcheck="true"></textarea>`;let area=b.querySelector('textarea'),nameInput=b.querySelector('input'),state=b.querySelector('.save-state'),savedName=name||'';area.value=text||'';if(opt.externalUrl)state.textContent='Aberto do site — salvar guarda uma cópia neste aparelho';let writeNow=async(manual)=>{let n=nameInput.value.trim();if(!n){if(manual)toast('Digite um nome.');return}if(!/\.txt$/i.test(n))n+='.txt';nameInput.value=n;let content=area.value;try{let h=opt.handleKey&&notesHandles.get(opt.handleKey);if(h){let wr=await h.createWritable();await wr.write(new Blob([content],{type:'text/plain;charset=utf-8'}));await wr.close()}else await put({name:n,blob:new Blob([content],{type:'text/plain;charset=utf-8'}),updated:Date.now()});if(savedName&&savedName!==n)await del(savedName);savedName=n;state.textContent='Salvo '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});if(manual)toast(h?'Salvo no arquivo do seu aparelho.':'Salvo neste navegador.')}catch(e){console.error(e);state.textContent='Não foi possível salvar'}};let timer;area.addEventListener('input',()=>{state.textContent='Digitando…';clearTimeout(timer);timer=setTimeout(()=>safe(()=>writeNow(false)),900)});b.querySelector('[data-save]').onclick=()=>safe(()=>writeNow(true));b.querySelector('[data-download]').onclick=()=>download(new Blob([area.value],{type:'text/plain;charset=utf-8'}),nameInput.value.split('/').pop()||'texto.txt')}


function zip(w,blob){let b=w.querySelector('.window-body');b.innerHTML='<div class="toolbar"><button class="btn primary" data-pick>⬆ Escolher arquivo ZIP</button></div><div class="zip-content"><p>Escolha uma pasta compactada (ZIP) para ver os arquivos nela.</p><pre></pre></div>';b.querySelector('[data-pick]').onclick=()=>{let i=document.createElement('input');i.type='file';i.accept='.zip,application/zip';i.onchange=()=>i.files[0]&&readZip(i.files[0]);i.click()};async function readZip(blob){let out=b.querySelector('pre');out.textContent='Lendo ZIP…';try{let bytes=new Uint8Array(await blob.arrayBuffer()),v=new DataView(bytes.buffer),end=-1;for(let i=bytes.length-22;i>=Math.max(0,bytes.length-65557);i--)if(v.getUint32(i,true)===0x06054b50){end=i;break}if(end<0)throw Error('ZIP inválido.');let count=v.getUint16(end+10,true),off=v.getUint32(end+16,true);if(count===65535||off===4294967295)throw Error('ZIP64 não suportado.');let rows=[];for(let n=0;n<count;n++){if(off+46>bytes.length||v.getUint32(off,true)!==0x02014b50)throw Error('Diretório ZIP inválido.');let sz=v.getUint32(off+24,true),nl=v.getUint16(off+28,true),el=v.getUint16(off+30,true),cl=v.getUint16(off+32,true);if(off+46+nl+el+cl>bytes.length)throw Error('ZIP incompleto.');rows.push(new TextDecoder().decode(bytes.slice(off+46,off+46+nl))+'  ('+sz+' bytes)');off+=46+nl+el+cl}out.textContent=count+' item(ns)\n\n'+rows.join('\n')}catch(e){out.textContent='Não foi possível ler: '+e.message}}if(blob)readZip(blob)}
function media(w,blob){let b=w.querySelector('.window-body');b.innerHTML='<div class="player"><video controls playsinline preload="metadata"></video><div><button class="btn" data-pick>📂 Abrir vídeo ou áudio</button></div></div>';let v=b.querySelector('video');function use(file){if(v.src.startsWith('blob:'))URL.revokeObjectURL(v.src);v.src=URL.createObjectURL(file);v.muted=false;v.volume=1}if(blob)use(blob);b.querySelector('[data-pick]').onclick=()=>{let i=document.createElement('input');i.type='file';i.accept='video/*,audio/*';i.onchange=()=>i.files[0]&&use(i.files[0]);i.click()}}

function browser(w){let b=w.querySelector('.window-body');b.innerHTML='<div class="browser-box"><h2>Internet Explorer</h2><p>Digite um endereço para abrir no navegador.</p><div class="urlbar"><input type="url" value="https://www.youtube.com" aria-label="Endereço do site"><button class="btn primary">Abrir ↗</button></div></div>';b.querySelector('button').onclick=()=>{let url=b.querySelector('input').value.trim();if(!/^https?:\/\//i.test(url))url='https://'+url;try{let u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw 0;window.open(u.href,'_blank','noopener,noreferrer')}catch{toast('Endereço inválido.')}}}
renderIcons();
