<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Salas ao Vivo — Day Trade</title>

  <style>
    :root {
      --fundo: #000;
      --card: #111;
      --amarelo: #ffd43b;
      --vermelho: #ef4444;
      --azul: #3b82f6;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: var(--fundo);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    h1 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 12px 8px;
      color: var(--amarelo);
      font-size: clamp(1.5rem, 5vw, 2.3rem);
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
    }

    .bolinha-titulo {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      border-radius: 50%;
      background: #ff3b30;
      box-shadow: 0 0 8px #ff3b30;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.6;
        transform: scale(0.85);
      }
    }

    .container-externo {
      width: 100%;
    }

    .card {
      width: 100%;
      margin: 0 0 16px;
      overflow: hidden;
      background: var(--card);
    }

    .player-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .youtube-player {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .nome-canal {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px 14px;
      font-size: 15px;
    }

    .nome-esq {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .etiqueta-aovivo {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      padding: 4px 9px;
      border-radius: 6px;
      background: linear-gradient(90deg, #ef4444, #dc2626);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .etiqueta-aovivo::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
    }

    .bolinha {
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
      border-radius: 50%;
    }

    .azul {
      background: var(--azul);
      box-shadow: 0 0 6px var(--azul);
    }

    .vermelha {
      background: var(--vermelho);
      box-shadow: 0 0 6px var(--vermelho);
    }

    @media (max-width: 520px) {
      .nome-canal {
        align-items: flex-start;
        flex-direction: column;
      }
      .etiqueta-aovivo {
        align-self: flex-start;
      }
    }
  </style>
</head>

<body>
  <h1>
    <span class="bolinha-titulo" aria-hidden="true"></span>
    Salas ao Vivo — Day Trade
  </h1>

  <main class="container-externo">
    <!-- CARD 1 -->
    <section class="card" aria-label="Sheriffao.Trader — Day Trade">
      <div class="player-wrap">
        <iframe 
          class="youtube-player"
          src="https://www.youtube.com/embed/b-S_iToVtQo"
          title="Sheriffao.Trader — Day Trade"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>
      <div class="nome-canal">
        <div class="nome-esq">
          <span class="bolinha vermelha" aria-hidden="true"></span>
          <span>Sheriffao.Trader — Day Trade</span>
        </div>
        <span class="etiqueta-aovivo">AO VIVO</span>
      </div>
    </section>

    <!-- CARD 2 -->
    <section class="card" aria-label="Genial Investimentos — Sala ao Vivo">
      <div class="player-wrap">
        <iframe 
          class="youtube-player"
          src="https://www.youtube.com/embed/"
          title="Genial Investimentos — Sala ao Vivo"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>
      <div class="nome-canal">
        <div class="nome-esq">
          <span class="bolinha azul" aria-hidden="true"></span>
          <span>Genial Investimentos — Sala ao Vivo</span>
        </div>
        <span class="etiqueta-aovivo">AO VIVO</span>
      </div>
    </section>
  </main>

</body>
</html>
